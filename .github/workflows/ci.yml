name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-biblioteca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Rodar testes frontend
        run: npm run test:ci