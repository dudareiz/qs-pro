name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: biblioteca-backend

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Permitir execução Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes backend
        run: ./mvnw clean test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-biblioteca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Rodar testes CI
        run: npm run test:ci